# Copy to kletz.toml (git-ignored) and adjust. Relative paths resolve against this file.
# Precedence for paths: the explicit argument (--db, --out), then the environment
# (ASI_KLETZ_DB, ASI_KLETZ_WORKBOOK, ASI_KLETZ_OUT), then this file, then the defaults
# next to the database (kletz.db, kletz.xlsx, out/).
# The window theme is not a project setting and is never read from this file: a pick latches in
# %LOCALAPPDATA%\asi\kletz\prefs.json (or $ASI_KLETZ_PREFS); `--theme` and $ASI_KLETZ_THEME are one-off.
# The family lock (one primary tool at a time) has no key here either: both primary tools read
# $ASI_PRIMARY_LOCK_DIR, else %LOCALAPPDATA%\asi\locks, so they always agree on the one directory.
# Nor does the automation server: it is per launch, its session file is %LOCALAPPDATA%\asi\kletz\session.json
# (or $ASI_KLETZ_SESSION), and ASI_KLETZ_AUTOMATION=off (or `asi-kletz-gui --no-server`) turns it off.

# SQLite database: the single source of truth.
db = "kletz.db"

# Excel workbook regenerated by `asi-kletz export excel` and Ctrl+E in the window.
# Point it at a shared folder if the workbook is read by other people.
workbook = "kletz.xlsx"

# Folder for the generated views: diagrams (`asi-kletz diagram ...`) and documents
# (`asi-kletz document ...`, the Markdown / PDF / Word triplet with its figures/ subfolder).
out = "out"

# JQL the JIRA Live Data window and `asi-kletz jira live` fetch (default: every HWL issue, newest
# change first). The result is a view held in memory; nothing from Jira is stored in kletz.db.
jira_live_jql = "project = HWL AND (assignee = currentUser() OR reporter = currentUser() OR watcher = currentUser()) ORDER BY updated DESC"

# Opt-in (default false since 0.7.4): the JIRA Live Data window never connects to Jira on its own;
# its first show says "No fetch yet · press Refresh" and waits. Set to true to fetch once when the
# window is first shown in a session. The fetch runs on a worker thread either way, so the
# window stays usable while it runs.
jira_live_autofetch = false

# Document control of the Safety Plan document (`asi-kletz document safety_plan`).
# The document id belongs to Kletz because Kletz owns the plan; leave it blank until the id
# is assigned and the build warns instead of failing. `project` goes on the cover.
doc_id = "ASI-FS-PLAN-001"
project = "WA485 Autonomous Wheel Loader"

# Revision history of the Safety Plan document, in file order. Each entry is one deliberate
# issue of the controlled document by a person; the audit log, which records every edit by
# anyone, is never used for this. The last entry's `rev` is the revision on the cover.
# Add an entry each time the plan is issued. Author is a role, not a person's name.
[[revision]]
rev = "0.1"
date = "2026-10-27"
author = "FuSa Engineer"
description = "Initial draft"

# Weekly Activity Tracker (`asi-kletz tracker ...`, 0.8.0). The title, byline, scope line and the
# Jira heading of the generated text. The byline names the person who keeps the tracker and belongs
# in this git-ignored file, never in code or in this example; the import says which of these the
# file carries and the config does not.
tracker_title = "WHEEL LOADER FUNCTIONAL SAFETY ENGINEERING - WEEKLY ACTIVITY TRACKER"
tracker_byline = "FuSa Engineer"
tracker_scope = "platform functional safety for the Wheel Loader programme (project HWL)."
tracker_jira_scope = "project HWL, open items I am assigned, reported or watching"

# Sprint defaults (TOML integers): points of capacity and length in days of a new sprint. A sprint
# stores its own values; these fill `sprint start` and the next sprint `sprint close` opens.
sprint_capacity = 10
sprint_days = 14
